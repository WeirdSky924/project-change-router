profile_id: reuse-runtime-policy

reuse_scan_scope:
  include_dependency_neighbors: true

reuse_scan_budget:
  max_candidate_files: 200
  max_owner_files_per_capability: 400
  max_comparisons: 5000
  max_file_bytes_for_full_similarity: 256000
  top_k_owner_files_per_candidate: 40
  min_fingerprint_advisory_score: 0.55

reuse_scan_runtime:
  soft_timeout_seconds: 60
  hard_timeout_seconds: 75
  checkpoint_interval_seconds: 5
  cache_mode: auto
  diagnostics_mode: auto
  persist_reports: true
  slow_scan_diagnostic_seconds: 10

reuse_scan_retention:
  canonical_max_age_days: 90
  canonical_max_count: 500
  checkpoint_max_age_days: 7
  diagnostic_max_age_days: 3
  diagnostic_max_count: 200
  max_cache_entries: 50000
  max_runtime_bytes: 536870912
