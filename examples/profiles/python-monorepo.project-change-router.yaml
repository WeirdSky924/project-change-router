profile_id: python-monorepo

capabilities:
  - id: billing-core
    name: Billing Core
    path_patterns:
      - "services/billing/**"
    keywords:
      - billing
      - invoice
      - payment
    aliases:
      - billing
      - payments
    public_entries:
      - "services/billing/__init__.py"
    contracts:
      - "Scope: owns billing invoice calculation, payment intent preparation, and billing-facing orchestration under services/billing."
      - "Boundary: does not own provider SDK adapters, webhook transport, or account identity policy."
      - "Risk: changes to public billing exports, invoice schema, or money movement behavior require review."
    test_bindings:
      - id: billing-core-tests
        label: Billing core tests
        when_actions: ["extend", "extract", "review"]
        when_changed_paths: ["services/billing/**"]
        related_tests: ["tests/test_billing.py"]
    lifecycle:
      definition_version: "1.0"
      status: stable
      stage: stable
      changelog:
        - date: "2026-05-23"
          event: initial-profile-template

ownership_rules:
  - path_patterns:
      - "services/billing/**"
    owner: billing-team

module_overrides:
  - path_patterns:
      - "services/billing/**"
    layer: shared-capability
    public_api: "__init__.py"
