schema_version: 1
mode: curated
cases:
  - id: review-cross-stack-billing-ui
    request: Modify billing invoice behavior and UI display together.
    expected_action: review
    expected_capabilities:
      - billing-core
      - billing-ui
    expected_modules:
      - services/billing
      - frontend
    expected_reads:
      - services/billing/service.py
