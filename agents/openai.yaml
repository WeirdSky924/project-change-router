interface:
  display_name: "Project Change Router"
  short_description: "Guard repo changes with routing direction and boundaries"
  icon_small: "./assets/router-icon.svg"
  icon_large: "./assets/router-icon.svg"
  brand_color: "#0F766E"
  default_prompt: "Use $project-change-router before code edits to get capability direction, canonical-root and owner signals, mandatory read/write boundaries, duplicate-implementation risks, and advisory action guidance. Respect guardrails; use actions and unblock suggestions as input to source-code analysis, not as final architecture decisions."
policy:
  allow_implicit_invocation: true
