interface:
  display_name: "Project Change Router"
  short_description: "Guard repo changes with routing direction and boundaries"
  icon_small: "./assets/router-icon.svg"
  icon_large: "./assets/router-icon.svg"
  brand_color: "#0F766E"
  default_prompt: "Use $project-change-router before code edits. Run the unified change flow, follow the authoritative execution_gate and fixed safety envelope, read precise path/symbol targets, and inspect all required reuse channels. Treat action, including review, as advisory direction for source analysis rather than write authority."
policy:
  allow_implicit_invocation: true
