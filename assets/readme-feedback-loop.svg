<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Continuous router calibration loop</title>
  <desc id="desc">A loop from profile data through route resolution, implementation, validation, feedback, and evaluation cases.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f3e8"/>
      <stop offset="1" stop-color="#dbeaf2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#223247" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#236b84"/>
    </marker>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <text x="72" y="67" font-family="Verdana, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#15283c">Calibration turns reviews into stronger routes</text>
  <text x="72" y="100" font-family="Verdana, Segoe UI, sans-serif" font-size="15" fill="#4e6578">Human decisions, profile fixes, and real regression cases continuously improve the local router bundle.</text>

  <path d="M223 226C245 123 355 94 456 125" fill="none" stroke="#236b84" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M536 126C639 78 770 119 817 218" fill="none" stroke="#236b84" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M815 285C756 377 609 398 500 337" fill="none" stroke="#236b84" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M419 337C309 385 205 330 220 232" fill="none" stroke="#236b84" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)" font-family="Verdana, Segoe UI, sans-serif">
    <rect x="100" y="154" width="238" height="122" rx="22" fill="#ffffff"/>
    <circle cx="142" cy="197" r="21" fill="#f4c36f"/>
    <text x="178" y="194" font-size="21" font-weight="700" fill="#15283c">Profile</text>
    <text x="178" y="224" font-size="14" fill="#566b7c">owners, paths, entries</text>
  </g>
  <g filter="url(#shadow)" font-family="Verdana, Segoe UI, sans-serif">
    <rect x="386" y="96" width="238" height="122" rx="22" fill="#ffffff"/>
    <circle cx="428" cy="139" r="21" fill="#69c2d8"/>
    <text x="464" y="136" font-size="21" font-weight="700" fill="#15283c">Resolve</text>
    <text x="464" y="166" font-size="14" fill="#566b7c">route + constraints</text>
  </g>
  <g filter="url(#shadow)" font-family="Verdana, Segoe UI, sans-serif">
    <rect x="688" y="154" width="238" height="122" rx="22" fill="#ffffff"/>
    <circle cx="730" cy="197" r="21" fill="#f4c36f"/>
    <text x="766" y="194" font-size="21" font-weight="700" fill="#15283c">Implement</text>
    <text x="766" y="224" font-size="14" fill="#566b7c">inside allowed paths</text>
  </g>
  <g filter="url(#shadow)" font-family="Verdana, Segoe UI, sans-serif">
    <rect x="560" y="291" width="238" height="104" rx="22" fill="#ffffff"/>
    <circle cx="602" cy="334" r="21" fill="#69c2d8"/>
    <text x="638" y="331" font-size="21" font-weight="700" fill="#15283c">Validate</text>
    <text x="638" y="361" font-size="14" fill="#566b7c">guardrails + evaluation</text>
  </g>
  <g filter="url(#shadow)" font-family="Verdana, Segoe UI, sans-serif">
    <rect x="258" y="291" width="238" height="104" rx="22" fill="#ffffff"/>
    <circle cx="300" cy="334" r="21" fill="#f4c36f"/>
    <text x="336" y="331" font-size="21" font-weight="700" fill="#15283c">Feedback</text>
    <text x="336" y="361" font-size="14" fill="#566b7c">reviews become cases</text>
  </g>

  <g font-family="Verdana, Segoe UI, sans-serif">
    <rect x="948" y="150" width="176" height="140" rx="24" fill="#15283c"/>
    <text x="982" y="198" font-size="20" font-weight="700" fill="#ffffff">Outcome</text>
    <text x="982" y="229" font-size="14" fill="#dbeaf2">less duplicate code</text>
    <text x="982" y="252" font-size="14" fill="#dbeaf2">fewer wrong layers</text>
  </g>
</svg>
