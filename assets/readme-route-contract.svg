<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Integrated route contract</title>
  <desc id="desc">Route action, evidence, constraints, and closeout flow as one contract.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c2c"/>
      <stop offset="1" stop-color="#26364a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#06101d" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#8ee7ff"/>
    </marker>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <g opacity="0.08" stroke="#ffffff">
    <path d="M0 96H1200M0 192H1200M0 288H1200M0 384H1200"/>
    <path d="M120 0V430M240 0V430M360 0V430M480 0V430M600 0V430M720 0V430M840 0V430M960 0V430M1080 0V430"/>
  </g>
  <text x="72" y="70" font-family="Verdana, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#f8fbff">One route decision, one contract</text>
  <text x="72" y="103" font-family="Verdana, Segoe UI, sans-serif" font-size="15" fill="#b9c8d8">Action, confidence, evidence, constraints, lifecycle, and closeout must be read together.</text>

  <g filter="url(#shadow)" font-family="Verdana, Segoe UI, sans-serif">
    <rect x="76" y="155" width="190" height="128" rx="20" fill="#f8fbff"/>
    <text x="108" y="202" font-size="22" font-weight="700" fill="#12253a">Action</text>
    <text x="108" y="232" font-size="14" fill="#44576b">reuse / extend</text>
    <text x="108" y="254" font-size="14" fill="#44576b">extract / new / review</text>
  </g>
  <g filter="url(#shadow)" font-family="Verdana, Segoe UI, sans-serif">
    <rect x="304" y="155" width="190" height="128" rx="20" fill="#f8fbff"/>
    <text x="336" y="202" font-size="22" font-weight="700" fill="#12253a">Evidence</text>
    <text x="336" y="232" font-size="14" fill="#44576b">profile + paths</text>
    <text x="336" y="254" font-size="14" fill="#44576b">owners + public APIs</text>
  </g>
  <g filter="url(#shadow)" font-family="Verdana, Segoe UI, sans-serif">
    <rect x="532" y="155" width="190" height="128" rx="20" fill="#f8fbff"/>
    <text x="564" y="202" font-size="22" font-weight="700" fill="#12253a">Constraints</text>
    <text x="564" y="232" font-size="14" fill="#44576b">allowed writes</text>
    <text x="564" y="254" font-size="14" fill="#44576b">must-read entries</text>
  </g>
  <g filter="url(#shadow)" font-family="Verdana, Segoe UI, sans-serif">
    <rect x="760" y="155" width="190" height="128" rx="20" fill="#f8fbff"/>
    <text x="792" y="202" font-size="22" font-weight="700" fill="#12253a">Governance</text>
    <text x="792" y="232" font-size="14" fill="#44576b">lifecycle + review</text>
    <text x="792" y="254" font-size="14" fill="#44576b">composite route</text>
  </g>
  <g filter="url(#shadow)" font-family="Verdana, Segoe UI, sans-serif">
    <rect x="988" y="155" width="136" height="128" rx="20" fill="#f8fbff"/>
    <text x="1018" y="202" font-size="22" font-weight="700" fill="#12253a">Closeout</text>
    <text x="1018" y="232" font-size="14" fill="#44576b">validate</text>
    <text x="1018" y="254" font-size="14" fill="#44576b">evaluate</text>
  </g>
  <g stroke="#8ee7ff" stroke-width="4" marker-end="url(#arrow)" opacity="0.9">
    <path d="M266 219H296"/>
    <path d="M494 219H524"/>
    <path d="M722 219H752"/>
    <path d="M950 219H980"/>
  </g>
  <g font-family="Verdana, Segoe UI, sans-serif">
    <rect x="76" y="330" width="310" height="44" rx="22" fill="#f4c36f" fill-opacity="0.96"/>
    <text x="104" y="358" font-size="16" font-weight="700" fill="#182233">low routing confidence =&gt; review</text>
    <rect x="420" y="330" width="326" height="44" rx="22" fill="#8ee7ff" fill-opacity="0.92"/>
    <text x="448" y="358" font-size="16" font-weight="700" fill="#182233">review means read-only until override</text>
    <rect x="780" y="330" width="344" height="44" rx="22" fill="#f8fbff" fill-opacity="0.92"/>
    <text x="808" y="358" font-size="16" font-weight="700" fill="#182233">feedback becomes evaluation coverage</text>
  </g>
</svg>
