<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Project Change Router overview</title>
  <desc id="desc">A README diagram showing how Project Change Router gives an agent direction, boundaries, and reuse guardrails before code edits.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#11243a"/>
      <stop offset="1" stop-color="#192f43"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf7ff"/>
      <stop offset="1" stop-color="#10b6c8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd689"/>
      <stop offset="1" stop-color="#f4a32f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#d9e7f3"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-35%" width="160%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#020814" flood-opacity="0.42"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7cf7ff"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#f4a32f"/>
    </marker>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#dff7ff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <style>
      .title { font: 800 38px Bahnschrift, Segoe UI, sans-serif; fill: #f8fbff; letter-spacing: -0.5px; }
      .subtitle { font: 500 18px Segoe UI, sans-serif; fill: #b9cbe0; }
      .label { font: 800 18px Bahnschrift, Segoe UI, sans-serif; fill: #122033; }
      .small { font: 600 13px Segoe UI, sans-serif; fill: #3f5368; }
      .tiny { font: 700 12px Segoe UI, sans-serif; fill: #bfd6e7; }
      .pill { font: 800 14px Bahnschrift, Segoe UI, sans-serif; fill: #07111f; }
    </style>
  </defs>

  <rect width="1400" height="620" rx="34" fill="url(#bg)"/>
  <rect width="1400" height="620" rx="34" fill="url(#grid)"/>
  <circle cx="690" cy="322" r="260" fill="#18c7d9" opacity="0.08"/>
  <circle cx="690" cy="322" r="165" fill="#ffd689" opacity="0.04"/>

  <text class="title" x="72" y="78">Project Change Router</text>
  <text class="subtitle" x="72" y="111">A direction index and boundary guardrail before AI agents edit large repositories.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="172" width="310" height="260" rx="28" fill="url(#panel)"/>
    <rect x="100" y="202" width="92" height="92" rx="24" fill="#10243a"/>
    <circle cx="146" cy="248" r="23" fill="url(#teal)" opacity="0.9"/>
    <path d="M132 248h28M146 234v28" stroke="#07111f" stroke-width="5" stroke-linecap="round"/>
    <text class="label" x="214" y="226">Agent request</text>
    <text class="small" x="214" y="253">limited context</text>
    <text class="small" x="214" y="276">local file bias</text>
    <text class="small" x="214" y="299">name-similarity risk</text>
    <rect x="100" y="330" width="238" height="54" rx="16" fill="#eaf3fa"/>
    <text class="small" x="122" y="352">"Where should this change live?"</text>
    <text class="small" x="122" y="374">"Can I reuse an existing capability?"</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="532" y="152" width="336" height="324" rx="36" fill="#0c1b2c" stroke="#7cf7ff" stroke-opacity="0.38"/>
    <circle cx="700" cy="278" r="94" fill="#07111f" stroke="#7cf7ff" stroke-width="4"/>
    <circle cx="700" cy="278" r="60" fill="#10243a" stroke="#ffd689" stroke-opacity="0.75" stroke-width="2"/>
    <path d="M700 196L724 278L700 360L676 278Z" fill="url(#teal)" opacity="0.92"/>
    <path d="M618 278L700 254L782 278L700 302Z" fill="#f8fbff" opacity="0.72"/>
    <circle cx="700" cy="278" r="16" fill="url(#amber)"/>
    <text x="700" y="416" text-anchor="middle" font-family="Bahnschrift, Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#f8fbff">PCR route report</text>
    <text x="700" y="445" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#b9cbe0">capability, owner, root, confidence, constraints</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1010" y="126" width="318" height="392" rx="30" fill="url(#panel)"/>
    <text class="label" x="1042" y="166">Large repository</text>
    <g transform="translate(1042 194)">
      <rect width="84" height="62" rx="14" fill="#16324a"/>
      <rect x="108" width="84" height="62" rx="14" fill="#16324a"/>
      <rect x="216" width="64" height="62" rx="14" fill="#16324a"/>
      <rect y="88" width="84" height="62" rx="14" fill="#16324a"/>
      <rect x="108" y="88" width="84" height="62" rx="14" fill="#16324a"/>
      <rect x="216" y="88" width="64" height="62" rx="14" fill="#16324a"/>
      <rect y="176" width="84" height="62" rx="14" fill="#16324a"/>
      <rect x="108" y="176" width="84" height="62" rx="14" fill="#16324a"/>
      <rect x="216" y="176" width="64" height="62" rx="14" fill="#16324a"/>
      <g fill="#7cf7ff" opacity="0.82">
        <circle cx="24" cy="22" r="5"/><circle cx="50" cy="22" r="5"/><circle cx="24" cy="42" r="5"/>
        <circle cx="132" cy="22" r="5"/><circle cx="158" cy="22" r="5"/><circle cx="132" cy="42" r="5"/>
        <circle cx="240" cy="22" r="5"/><circle cx="262" cy="42" r="5"/>
      </g>
      <rect x="108" y="176" width="84" height="62" rx="14" fill="none" stroke="#7cf7ff" stroke-width="4"/>
      <path d="M124 207l16 16l34-38" fill="none" stroke="#7cf7ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="1042" y="462" width="114" height="34" rx="17" fill="#dffcff"/>
    <text class="pill" x="1099" y="484" text-anchor="middle">canonical root</text>
    <rect x="1170" y="462" width="112" height="34" rx="17" fill="#ffe7b8"/>
    <text class="pill" x="1226" y="484" text-anchor="middle">owner boundary</text>
  </g>

  <path d="M392 302C452 302 470 278 528 278" fill="none" stroke="#7cf7ff" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-teal)" filter="url(#glow)"/>
  <path d="M872 278C934 278 940 278 1000 278" fill="none" stroke="#7cf7ff" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-teal)" filter="url(#glow)"/>
  <path d="M386 380C470 500 920 512 1006 404" fill="none" stroke="#f4a32f" stroke-width="5" stroke-dasharray="14 12" marker-end="url(#arrow-amber)"/>

  <g filter="url(#shadow)">
    <rect x="430" y="514" width="548" height="58" rx="24" fill="#f8fbff"/>
    <text x="704" y="539" text-anchor="middle" font-family="Bahnschrift, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#122033">Prevents structural drift</text>
    <text x="704" y="561" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#51677b">reuse existing capability, respect write boundaries, avoid parallel implementation centers</text>
  </g>

  <g>
    <rect x="438" y="166" width="120" height="34" rx="17" fill="#7cf7ff" opacity="0.92"/>
    <text class="pill" x="498" y="188" text-anchor="middle">direction</text>
    <rect x="842" y="166" width="122" height="34" rx="17" fill="#ffd689" opacity="0.96"/>
    <text class="pill" x="903" y="188" text-anchor="middle">guardrails</text>
    <rect x="600" y="116" width="200" height="34" rx="17" fill="#f8fbff" opacity="0.95"/>
    <text class="pill" x="700" y="138" text-anchor="middle">less guessing before editing</text>
  </g>
</svg>
